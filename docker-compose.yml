services:
  app:
    build: .
    ports:
      # ponytail: host port overridable for when 8000 is taken; LIFETRACK_PORT=8001 docker compose up
      - "${LIFETRACK_PORT:-8000}:8000"
    # DB + backups live in ./data on the host so they survive `docker compose
    # down` and image rebuilds, and stay visible/copyable outside the container.
    volumes:
      - ./data:/data
    environment:
      - LIFETRACK_DB_URL=sqlite:////data/life_track.db
      - LIFETRACK_BACKUP_DIR=/data/backup
    restart: unless-stopped
